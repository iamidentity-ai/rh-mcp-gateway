# Gateway API needs an implementation. The MCP gateway extends a Gateway API
# Gateway and configures Envoy on it, so the GatewayClass must be Envoy-based.
# Red Hat's supported path is Service Mesh 3 (Istio).
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: servicemeshoperator3
  namespace: openshift-operators
spec:
  channel: stable
  installPlanApproval: Automatic
  name: servicemeshoperator3
  source: redhat-operators
  sourceNamespace: openshift-marketplace
