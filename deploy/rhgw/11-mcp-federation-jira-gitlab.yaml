# Jira and GitLab, federated behind the SAME broker as databricks-mcp
# (deploy/rhgw/07-mcp-federation.yaml) -- one MCPGatewayExtension per
# namespace, so this file adds only what's per-upstream: an HTTPRoute +
# MCPServerRegistration pair for each. See 07's own header comments for the
# ordering rationale (an HTTPRoute is what a registration points at; the
# registration is what federates the tools; the extension, already applied
# by 07, is what turns the Gateway into an MCP broker at all).
#
# DISTINCT HOSTNAME PER UPSTREAM, on purpose (RHGW-P9's hard lesson, see
# 07's own comment on databricks-mcp-route): the mcp-router ext_proc rewrites
# `:authority` to the upstream route's hostname before ext_authz/the broker
# ever see the request, so any two upstreams sharing a hostname collide --
# the rewritten hop for one silently lands on the other's route. jira-mcp
# and gitlab-mcp each get their own, matching the pattern Red Hat's own
# samples use (config/samples/httproute-calendar.yaml) and this repo already
# proved out for databricks-mcp.
---
# 1. Jira
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: jira-mcp-route
  namespace: mcp-gateway-demo
spec:
  parentRefs:
    - name: mcp-gw
      sectionName: http
  hostnames:
    - jira-mcp.gateway.internal
  rules:
    - matches:
        - path: {type: PathPrefix, value: /mcp}
      backendRefs:
        - name: jira-mcp
          port: 5114
---
apiVersion: mcp.kuadrant.io/v1alpha1
kind: MCPServerRegistration
metadata:
  name: jira-mcp
  namespace: mcp-gateway-demo
spec:
  targetRef:
    group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: jira-mcp-route
  path: /mcp
  prefix: jira
  hint: "Jira Cloud ticket reads, gated per call by IBM Verify."
  tags: ["jira", "mcp-gateway-demo"]
  category: ["tickets"]
  state: Enabled
---
# 2. GitLab
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: gitlab-mcp-route
  namespace: mcp-gateway-demo
spec:
  parentRefs:
    - name: mcp-gw
      sectionName: http
  hostnames:
    - gitlab-mcp.gateway.internal
  rules:
    - matches:
        - path: {type: PathPrefix, value: /mcp}
      backendRefs:
        - name: gitlab-mcp
          port: 5115
---
apiVersion: mcp.kuadrant.io/v1alpha1
kind: MCPServerRegistration
metadata:
  name: gitlab-mcp
  namespace: mcp-gateway-demo
spec:
  targetRef:
    group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: gitlab-mcp-route
  path: /mcp
  prefix: gitlab
  hint: "GitLab file reads, gated per call by IBM Verify."
  tags: ["gitlab", "mcp-gateway-demo"]
  category: ["source-control"]
  state: Enabled
